<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seacond sea - Mặc Mỗi Ngày, Thoải Mái Mỗi Ngày</title>
    <!-- CSS riêng của trang (không dùng Tailwind) -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/auth-admin.css">
    <link rel="stylesheet" href="css/cart-checkout.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


    <!-- Header / Navbar -->
    <header class="site-header">
        <div class="container header-inner">

            <!-- Logo -->
            <div>
                <a href="#" class="logo">SECOND SEA</a>
            </div>

            <!-- Desktop Navigation -->
            <nav class="main-nav">
                <a href="#t-shirt">T-Shirt</a>
                <a href="#jacket">Jacket</a>
                <a href="#pants">Pants</a>
                <a href="#accessories">Accessories</a>
            </nav>

            <!-- Right Actions (Search, User, Cart, Menu) -->
            <div class="header-actions">
                <a href="#admin" id="admin-link" class="admin-link" hidden>Quản trị</a>
                <a href="#login" id="user-link" class="icon-btn" aria-label="Tài khoản">
                    <i class="far fa-user"></i>
                </a>
                <a href="#cart" class="icon-btn" aria-label="Giỏ hàng">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cart-count" hidden>0</span>
                </a>
            </div>
        </div>

    </header>

    
    <div id="app-views"></div>

    <script src="js/bootstrap.js"></script>
</body>
</html>
