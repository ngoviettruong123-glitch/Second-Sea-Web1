<section class="page-view auth-view" data-view="register" hidden>
        <div class="auth-card">
            <a href="#" class="auth-logo">SECOND SEA</a>
            <h1>Đăng ký</h1>
            <form id="register-form" class="form">
                <label class="field">
                    Họ và tên
                    <input type="text" id="reg-name" required>
                </label>
                <label class="field">
                    Email
                    <input type="email" id="reg-email" required>
                </label>
                <label class="field">
                    Số điện thoại
                    <input type="tel" id="reg-phone">
                </label>
                <label class="field">
                    Mật khẩu (tối thiểu 6 ký tự)
                    <input type="password" id="reg-password" minlength="6" required>
                </label>
                <label class="field">
                    Nhập lại mật khẩu
                    <input type="password" id="reg-confirm" minlength="6" required>
                </label>
                <p class="form-msg" id="reg-msg"></p>
                <button type="submit" class="btn-primary">Tạo tài khoản</button>
            </form>
            <p class="auth-switch">Đã có tài khoản? <a href="#login">Đăng nhập</a></p>
        </div>
    </section>
