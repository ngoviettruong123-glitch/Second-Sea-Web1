<section class="page-view" data-view="cart" hidden>
        <div class="page-wrap">
            <div class="page-head">
                <h1>Giỏ hàng</h1>
            </div>
            <div class="cart-layout">
                <div class="card" id="cart-list"></div>
                <aside class="card" id="cart-summary">
                    <h2>Tóm tắt đơn hàng</h2>
                    <div class="info-row"><span>Tạm tính</span><span id="sum-subtotal"></span></div>
                    <div class="info-row"><span>Vận chuyển</span><span id="sum-shipping"></span></div>
                    <div class="info-row total-row"><span>Tổng cộng</span><span id="sum-total"></span></div>
                    <p class="muted" id="shipping-note"></p>
                    <button class="btn-primary btn-full" id="cart-checkout">Tiến hành thanh toán</button>
                </aside>
            </div>
        </div>
    </section>
